<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}게시판{% endblock %}</title>
  <style>
    :root { color-scheme: light dark; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo",
        "Malgun Gothic", sans-serif;
      line-height: 1.6;
      background: #f6f7f9;
      color: #1a1c1f;
    }
    .wrap { max-width: 760px; margin: 0 auto; padding: 24px 16px 64px; }
    header {
      display: flex; align-items: baseline; justify-content: space-between;
      border-bottom: 2px solid #1a1c1f; padding-bottom: 12px; margin-bottom: 20px;
    }
    header h1 { font-size: 20px; margin: 0; }
    header h1 a { color: inherit; text-decoration: none; }
    header .env { font-size: 12px; color: #6b7280; }
    table { width: 100%; border-collapse: collapse; background: #fff; }
    th, td { padding: 10px 12px; border-bottom: 1px solid #e5e7eb; text-align: left; }
    th { background: #f0f1f3; font-size: 13px; color: #4b5563; }
    td.num, th.num { width: 56px; color: #9ca3af; }
    td.date, th.date { width: 132px; color: #6b7280; font-size: 13px; }
    td.who, th.who { width: 96px; }
    a { color: #1d4ed8; }
    .btn {
      display: inline-block; padding: 8px 14px; border-radius: 6px;
      border: 1px solid #1a1c1f; background: #1a1c1f; color: #fff;
      text-decoration: none; font-size: 14px; cursor: pointer;
    }
    .btn.ghost { background: #fff; color: #1a1c1f; }
    .btn.danger { background: #b91c1c; border-color: #b91c1c; }
    .actions { display: flex; gap: 8px; margin-top: 20px; align-items: center; }
    form.card, article.card {
      background: #fff; border: 1px solid #e5e7eb; border-radius: 8px; padding: 20px;
    }
    label { display: block; font-size: 13px; font-weight: 600; margin: 14px 0 6px; }
    input, textarea {
      width: 100%; padding: 9px 11px; border: 1px solid #d1d5db;
      border-radius: 6px; font: inherit; background: #fff; color: inherit;
    }
    textarea { min-height: 200px; resize: vertical; }
    .flash {
      background: #fef2f2; border: 1px solid #fecaca; color: #991b1b;
      padding: 10px 14px; border-radius: 6px; margin-bottom: 16px; font-size: 14px;
    }
    .meta { color: #6b7280; font-size: 13px; margin: 4px 0 16px; }
    .content { white-space: pre-wrap; }
    .inline { display: inline; }
    .empty { padding: 40px; text-align: center; color: #6b7280; background: #fff; }
    @media (prefers-color-scheme: dark) {
      body { background: #16181c; color: #e5e7eb; }
      header { border-bottom-color: #e5e7eb; }
      table, form.card, article.card, .empty { background: #1f2226; border-color: #33373d; }
      th { background: #26292e; color: #9ca3af; }
      th, td { border-bottom-color: #33373d; }
      input, textarea { background: #16181c; border-color: #4b5563; }
      .btn.ghost { background: #1f2226; color: #e5e7eb; }
      a { color: #93b4ff; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <h1><a href="{{ url_for('index') }}">게시판</a></h1>
      <span class="env">WEB-SERVER (public) → DB-SERVER (private)</span>
    </header>
    {% with messages = get_flashed_messages() %}
      {% for message in messages %}
        <div class="flash">{{ message }}</div>
      {% endfor %}
    {% endwith %}
    {% block body %}{% endblock %}
  </div>
</body>
</html>
